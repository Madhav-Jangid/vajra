name: Vajra vs Stockfish Strength Ladder

on:
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stockfish_elo: [2100, 2200, 2300, 2400, 2500]
        batch: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build Vajra UCI
        run: |
          go build -o vajra ./cmd/uci

      - name: Prepare Stockfish
        run: |
          cp ./tools/stockfish/stockfish-linux-x86-64-universal ./stockfish
          chmod +x ./stockfish

      - name: Install Cute Chess CLI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6core6 \
            libqt6gui6 \
            libqt6network6 \
            libqt6widgets6 \
            cmake \
            build-essential \
            git

      - name: Build Cute Chess CLI
        run: |
          git clone --depth 1 https://github.com/cutechess/cutechess.git
          cd cutechess
          cmake -B build -DCUTECHESS_WITH_GUI=OFF
          cmake --build build --config Release -j2

      - name: Test Vajra UCI
        run: |
          printf "uci\nisready\nquit\n" | ./vajra

      - name: Run tournament
        run: |
          mkdir -p tournament

          PGN="$GITHUB_WORKSPACE/tournament/vajra-stockfish-${{ matrix.stockfish_elo }}-batch-${{ matrix.batch }}.pgn"

          ./cutechess/build/cutechess-cli \
            -engine \
              cmd="$GITHUB_WORKSPACE/vajra" \
              name="Vajra 0.1.0" \
              proto=uci \
            -engine \
              cmd="$GITHUB_WORKSPACE/stockfish" \
              name="Stockfish ${{ matrix.stockfish_elo }}" \
              proto=uci \
              option.UCI_LimitStrength=true \
              option.UCI_Elo=${{ matrix.stockfish_elo }} \
            -each \
              tc=40/150 \
              proto=uci \
              option.Threads=1 \
              option.Hash=512 \
            -games 25 \
            -repeat \
            -recover \
            -concurrency 1 \
            -pgnout "$PGN"

      - name: Check PGN
        run: |
          PGN="tournament/vajra-stockfish-${{ matrix.stockfish_elo }}-batch-${{ matrix.batch }}.pgn"

          echo "Checking: $PGN"

          if [ ! -f "$PGN" ]; then
            echo "PGN file not found"
            exit 1
          fi

          echo "Completed games:"
          grep -c '^\[Result ' "$PGN" || true

      - name: Upload tournament PGN
        uses: actions/upload-artifact@v4
        with:
          name: vajra-stockfish-${{ matrix.stockfish_elo }}-batch-${{ matrix.batch }}
          path: tournament/vajra-stockfish-${{ matrix.stockfish_elo }}-batch-${{ matrix.batch }}.pgn
          retention-days: 30