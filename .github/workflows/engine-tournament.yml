name: Vajra vs Stockfish Tournament

on:
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vajra
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build Vajra UCI
        shell: bash
        run: |
          go version

          GOOS=linux GOARCH=amd64 \
            go build -o vajra ./cmd/uci

          chmod +x vajra

          echo "Vajra built:"
          file vajra

      - name: Download Stockfish
        shell: bash
        run: |
          set -e

          wget -q \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            -O stockfish.tar.gz

          echo "Extracting Stockfish..."
          tar -xzf stockfish.tar.gz

          STOCKFISH_BIN=$(find . -type f -name "stockfish" | head -n 1)

          if [ -z "$STOCKFISH_BIN" ]; then
            echo "Stockfish binary not found."
            find . -type f
            exit 1
          fi

          echo "Found Stockfish at: $STOCKFISH_BIN"

          cp "$STOCKFISH_BIN" ./stockfish
          chmod +x ./stockfish

          echo "Testing Stockfish UCI..."

          timeout 10s ./stockfish <<EOF
          uci
          isready
          quit
          EOF


      - name: Install Cute Chess CLI
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-tools-dev \
            git

          git clone --depth 1 https://github.com/cutechess/cutechess.git

          cd cutechess
          qmake6
          make -j2

          sudo cp cutechess-cli /usr/local/bin/cutechess-cli

          cutechess-cli --version

      - name: Test Vajra UCI
        shell: bash
        run: |
          echo "Testing Vajra UCI..."

          timeout 10s ./vajra <<EOF
          uci
          isready
          quit
          EOF

      - name: Run tournament
        shell: bash
        run: |
          mkdir -p tournament

          cutechess-cli \
            -engine \
              cmd="$GITHUB_WORKSPACE/vajra" \
              name="Vajra 0.1.0" \
              proto=uci \
            -engine \
              cmd="$GITHUB_WORKSPACE/stockfish" \
              name="Stockfish 2500" \
              proto=uci \
              option.UCI_LimitStrength=true \
              option.UCI_Elo=2500 \
            -each \
              tc=40/300 \
              proto=uci \
              option.Threads=1 \
              option.Hash=512 \
            -games 200 \
            -repeat \
            -recover \
            -concurrency 1 \
            -pgnout "$GITHUB_WORKSPACE/tournament/vajra-stockfish-2500.pgn"

      - name: Check tournament result
        shell: bash
        run: |
          echo "Tournament completed."

          if [ ! -f tournament/vajra-stockfish-2500.pgn ]; then
            echo "ERROR: PGN was not created."
            exit 1
          fi

          echo
          echo "PGN size:"
          wc -c tournament/vajra-stockfish-2500.pgn

          echo
          echo "Games found:"
          grep -c '^\[Result ' tournament/vajra-stockfish-2500.pgn || true

          echo
          echo "PGN:"
          head -30 tournament/vajra-stockfish-2500.pgn

      - name: Upload tournament PGN
        uses: actions/upload-artifact@v4
        with:
          name: vajra-stockfish-2500-pgn
          path: tournament/vajra-stockfish-2500.pgn
          retention-days: 30