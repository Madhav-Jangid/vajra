name: Vajra vs Stockfish Tournament

on:
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest

    steps:
      # =========================================
      # Checkout repository
      # =========================================
      - name: Checkout Vajra
        uses: actions/checkout@v4

      # =========================================
      # Setup Go
      # =========================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # =========================================
      # Build Vajra UCI
      # =========================================
      - name: Build Vajra UCI
        shell: bash
        run: |
          set -e

          echo "Go version:"
          go version

          echo
          echo "Building Vajra UCI..."

          GOOS=linux GOARCH=amd64 \
            go build -o vajra ./cmd/uci

          chmod +x ./vajra

          echo
          echo "Vajra binary:"
          file ./vajra

      # =========================================
      # Prepare Stockfish
      # =========================================
      - name: Prepare Stockfish
        shell: bash
        run: |
          set -e

          STOCKFISH="./tools/stockfish/stockfish-linux-x86-64-universal"

          echo "Looking for Stockfish at:"
          echo "$STOCKFISH"

          if [ ! -f "$STOCKFISH" ]; then
            echo
            echo "ERROR: Stockfish binary not found."
            echo
            echo "Files inside tools/stockfish:"
            find ./tools/stockfish -maxdepth 2 -type f -print
            exit 1
          fi

          cp "$STOCKFISH" ./stockfish
          chmod +x ./stockfish

          echo
          echo "Stockfish binary:"
          file ./stockfish

          echo
          echo "Testing Stockfish UCI..."

          timeout 10s ./stockfish <<EOF
          uci
          isready
          quit
          EOF

          echo
          echo "Stockfish UCI test passed."

      # =========================================
      # Install Cute Chess CLI
      # =========================================
      - name: Install Cute Chess CLI
        shell: bash
        run: |
          set -e

          echo "Installing Cute Chess dependencies..."

          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-svg-dev

          echo
          echo "Qt version:"
          qmake6 --version || true

          echo
          echo "Cloning Cute Chess 1.5.1..."

          git clone \
            --depth 1 \
            https://github.com/cutechess/cutechess.git

          cd cutechess

          echo
          echo "Building Cute Chess..."

          cmake -S . -B build
          cmake --build build --parallel 2

          echo
          echo "Locating cutechess-cli..."

          CLI=$(find build -type f -name "cutechess-cli" -print -quit)

          if [ -z "$CLI" ]; then
            echo "ERROR: cutechess-cli was not found."

            echo
            echo "Executable files produced by build:"
            find build -type f -executable -print

            exit 1
          fi

          echo "Found: $CLI"

          sudo cp "$CLI" /usr/local/bin/cutechess-cli
          sudo chmod +x /usr/local/bin/cutechess-cli

          echo
          echo "Cute Chess version:"
          cutechess-cli --version

          echo
          echo "Cute Chess CLI installed successfully."

          
      # =========================================
      # Test Vajra UCI
      # =========================================
      - name: Test Vajra UCI
        shell: bash
        run: |
          set -e

          echo "Testing Vajra UCI..."

          timeout 10s ./vajra <<EOF
          uci
          isready
          quit
          EOF

          echo
          echo "Vajra UCI test passed."

      # =========================================
      # Run Tournament
      # =========================================
      - name: Run tournament
        shell: bash
        run: |
          set -e

          mkdir -p tournament

          echo
          echo "========================================="
          echo "Starting Vajra vs Stockfish tournament"
          echo "========================================="
          echo
          echo "Vajra:       0.1.0"
          echo "Stockfish:   2500 Elo"
          echo "Games:       200"
          echo "Threads:     1"
          echo "Hash:        512 MB"
          echo "Time control: 40 moves / 300 seconds"
          echo

          cutechess-cli \
            -engine \
              cmd="$GITHUB_WORKSPACE/vajra" \
              name="Vajra 0.1.0" \
              proto=uci \
            -engine \
              cmd="$GITHUB_WORKSPACE/stockfish" \
              name="Stockfish 2500" \
              proto=uci \
              option.UCI_LimitStrength=true \
              option.UCI_Elo=2500 \
            -each \
              tc=40/300 \
              proto=uci \
              option.Threads=1 \
              option.Hash=512 \
            -games 200 \
            -repeat \
            -recover \
            -concurrency 1 \
            -pgnout "$GITHUB_WORKSPACE/tournament/vajra-stockfish-2500.pgn"

      # =========================================
      # Check Tournament Result
      # =========================================
      - name: Check tournament result
        shell: bash
        run: |
          set -e

          PGN="tournament/vajra-stockfish-2500.pgn"

          if [ ! -f "$PGN" ]; then
            echo
            echo "ERROR: PGN was not created."
            exit 1
          fi

          echo
          echo "========================================="
          echo "Tournament completed"
          echo "========================================="

          echo
          echo "PGN size:"
          wc -c "$PGN"

          echo
          echo "Games found:"
          grep -c '^\[Result ' "$PGN" || true

          echo
          echo "First game:"
          head -40 "$PGN"

      # =========================================
      # Upload PGN
      # =========================================
      - name: Upload tournament PGN
        uses: actions/upload-artifact@v4
        with:
          name: vajra-stockfish-2500-pgn
          path: tournament/vajra-stockfish-2500.pgn
          retention-days: 30